# Optional: host these pages on Netlify instead of a Hugging Face Static Space.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "same-origin"
    Content-Security-Policy = "default-src 'self'; img-src 'self' data:; connect-src 'self' https://*.onrender.com; frame-ancestors 'none'"
