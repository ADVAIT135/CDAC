<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Create questions · Exam Portal</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="bar" id="bar"><a class="brand" href="index.html">Exam Portal</a></header>
<main>
<h1>Create questions</h1>
<p class="muted" id="tally" aria-live="polite"></p>
<div id="msg" class="msg" role="status" aria-live="polite"></div>
<form id="form">
  <div id="list"></div>
  <div class="row">
    <button class="btn" id="add" type="button">Add another question</button>
    <span class="grow"></span>
    <button class="btn primary" id="save" type="submit">Save questions</button>
  </div>
</form>
</main>
<script type="module" src="js/teacher.js"></script>
</body>
</html>
